<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="stylesheet" href="../css/contact_style.css">
  <title>Frontend Mentor | myteam website challenge - Contact</title>
</head>

<body>
  
  <header>
        <div class="container site-header">
      <div class="site-header-left">
        <a href="../index.html" class="logo">
          <img src="../assets/logo.svg" alt="myteam" />
        </a>
        <nav class="main-nav body-1">
          <a href="../index.html" class="is-active">home</a>
          <a href="/pages/about.html">about</a>
        </nav>
      </div>
  </header>

  <main>

    <section class="contact">

      <figure class="half-donut">
        <img src="../assets/bg-pattern-about-2-contact-1.svg" alt="dark half donut">
      </figure>

      <article class="contact-content">

        <div class="contact-content-intro">

          <h1 class="h1-small text-white h1-margin">Contact</h1>
          <h2 class="ask-about-us">Ask us about</h2>

          <ul>
            <li class="contact-card">
              <figure>
                <img src="../assets/icon-person.svg" alt="">
              </figure>
              <span class="body-1 text-white">The quality of our talent network</span>
            </li>

            <li class="contact-card">
              <figure>
                <img src="../assets/icon-cog.svg" alt="">
              </figure>
              <span class="body-1 text-white">Usage &amp; implementation of our software</span>
            </li>

            <li class="contact-card">
              <figure>
                <img src="../assets/icon-chart.svg" alt="">
              </figure>
              <span class="body-1 text-white">How we help drive innovation</span>
            </li>
          </ul>
        </div>

        <div class="contact-content-form-container">

          <form class="contact-form body-1" action="/pages/contact.html" method="post">

          
            <input type="text" id="name" name="name" placeholder="Name" />
           
            <input type="email" id="email" name="email" placeholder="Email" />

            <input type="company-name" id="company-name" name="company-name" placeholder="Company Name" />

            <input type="title" id="title" name="title" placeholder="Title" />

            <textarea id="message" name="message" placeholder="Message"></textarea>
            <button type="submit" class="submit-btn body-1">submit</button>
          </form>
        </div>
      </article>

      <figure class="half-pink-donut">
        <img src="../assets/bg-pattern-contact-2.svg" alt="pink half donut">
      </figure>

    </section>

  </main>

  <footer class="footer">
    <div class="footer-container">

      <!-- Logo and navigation -->
      <div class="footer-brand">
        <a href="/" class="footer-logo"><img src="/assets/logo.svg" alt="" srcset=""></a>

        <nav class="footer-nav h3" aria-label="Footer navigation">
          <a href="/">home</a>
          <a href="/pages/about.html">about</a>
        </nav>
      </div>

      <!-- Contact information -->
      <address class="footer-contact body-2">
        <p>987 Hillcrest Lane</p>
        <p>Irvine, CA</p>
        <p>California 92714</p>
        <p>
          Call Us:
          <a href="tel:+19498337432">949-833-7432</a>
        </p>
      </address>

      <!-- Social media and copyright -->
      <div class="footer-right body-2">

        <div class="social-links">
          <a href="#" aria-label="Facebook">
            <img src="../assets/icon-facebook.svg" alt="">
          </a>

          <a href="#" aria-label="Pinterest">
            <img src="../assets/icon-pinterest.svg" alt="">
          </a>

          <a href="#" aria-label="Twitter">
            <img src="../assets/icon-twitter.svg" alt="">
          </a>
        </div>

        <p class="copyright">
          Copyright 2020. All Rights Reserved
        </p>

      </div>

    </div>
  </footer>




</body>

</html>
